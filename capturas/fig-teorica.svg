<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="380" fill="#ffffff" stroke="#cccccc"/>

  <!-- Titulos -->
  <text x="205" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Sin volumen</text>
  <text x="595" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Con volumen</text>
  <line x1="400" y1="50" x2="400" y2="360" stroke="#cccccc" stroke-dasharray="4 4"/>

  <!-- Panel izquierdo -->
  <rect x="40" y="70" width="330" height="70" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="205" y="98" text-anchor="middle" font-size="14" fill="#111">Contenedor server_db1</text>
  <text x="205" y="120" text-anchor="middle" font-size="13" fill="#333">los datos viven dentro del contenedor</text>

  <line x1="205" y1="140" x2="205" y2="170" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <text x="215" y="160" font-size="12" fill="#444">docker rm</text>

  <rect x="40" y="170" width="330" height="70" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text x="205" y="198" text-anchor="middle" font-size="14" fill="#555">Contenedor eliminado</text>
  <text x="205" y="220" text-anchor="middle" font-size="13" fill="#b91c1c">los datos se pierden</text>

  <line x1="205" y1="240" x2="205" y2="270" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <text x="215" y="260" font-size="12" fill="#444">docker run</text>

  <rect x="40" y="270" width="330" height="70" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="205" y="298" text-anchor="middle" font-size="14" fill="#111">Contenedor nuevo</text>
  <text x="205" y="320" text-anchor="middle" font-size="13" fill="#b91c1c">sin la base de datos test</text>

  <!-- Panel derecho -->
  <rect x="420" y="70" width="150" height="70" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="495" y="98" text-anchor="middle" font-size="14" fill="#111">Contenedor</text>
  <text x="495" y="118" text-anchor="middle" font-size="14" fill="#111">server_db2</text>
  <rect x="620" y="70" width="150" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="695" y="98" text-anchor="middle" font-size="14" fill="#111">Volumen pgdata</text>
  <text x="695" y="118" text-anchor="middle" font-size="12" fill="#333">datos de PostgreSQL</text>
  <line x1="570" y1="105" x2="620" y2="105" stroke="#444" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>

  <line x1="495" y1="140" x2="495" y2="170" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <text x="505" y="160" font-size="12" fill="#444">docker rm</text>

  <rect x="420" y="170" width="150" height="70" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text x="495" y="198" text-anchor="middle" font-size="14" fill="#555">Contenedor</text>
  <text x="495" y="218" text-anchor="middle" font-size="14" fill="#555">eliminado</text>
  <rect x="620" y="170" width="150" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="695" y="198" text-anchor="middle" font-size="14" fill="#111">Volumen pgdata</text>
  <text x="695" y="218" text-anchor="middle" font-size="12" fill="#15803d">sigue existiendo</text>

  <line x1="495" y1="240" x2="495" y2="270" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <text x="505" y="260" font-size="12" fill="#444">docker run -v pgdata</text>

  <rect x="420" y="270" width="150" height="70" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="495" y="298" text-anchor="middle" font-size="14" fill="#111">Contenedor</text>
  <text x="495" y="318" text-anchor="middle" font-size="14" fill="#111">server_db2 (nuevo)</text>
  <rect x="620" y="270" width="150" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="695" y="298" text-anchor="middle" font-size="14" fill="#111">Volumen pgdata</text>
  <text x="695" y="318" text-anchor="middle" font-size="12" fill="#15803d">los datos siguen</text>
  <line x1="570" y1="305" x2="620" y2="305" stroke="#444" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>

  <text x="400" y="368" text-anchor="middle" font-size="11" fill="#777">Esquema de elaboración propia</text>
</svg>
